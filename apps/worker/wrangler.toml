name = "okdam-songbook"
main = "src/index.ts"
compatibility_date = "2026-09-18"

# No public route. Songbook trusts the Common Auth gateway's identity headers
# (DEC-20260914-002) and has no way to tell a forged one from a real one, so it
# must never be reachable except through the gateway. On OCI that is a loopback
# bind; here it is the absence of a workers.dev subdomain and of any [[routes]]
# entry, leaving a service binding from the gateway Worker as the only way in.
workers_dev = false

[assets]
directory = "../web/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "SONGBOOK_DB"
database_name = "okdam-songbook"
database_id = "9b353a3b-6526-4d14-8b10-5f618275b4cf"

[vars]
ORIGIN = "https://okdam.lost.plus"
AI_ENDPOINT = "https://api.cloudflare.com/client/v4/accounts/f6f0cfde81175292c71fa85240e910dc/ai/v1/chat/completions"
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"

# Secret, set with `wrangler secret put CLOUDFLARE_AI_API_TOKEN`.
# All three must be set together or the Worker refuses to start; set none and
# AI reading generation is simply off. The name matches the Node runtime's so
# deploy/container/songbook.env can be copied across without translation.
